<!-- ============================
     ESTILOS DE LA GALERÍA
     ============================ -->
<style>

/* Grid de 6 filas × 5 columnas */
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 18px;
    margin-top: 25px;
}

/* Cada imagen */
.gallery-item {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .25s ease, box-shadow .25s ease;
}

.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Hover */
.gallery-item:hover {
    transform: scale(1.03);
    box-shadow: 0 12px 28px rgba(0,0,0,0.45);
}

/* ZOOM */
#zoomOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#zoomOverlay img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

/* BOTONES */
.btn-primary {
    display: inline-block;
    padding: 12px 22px;
    background: #ff6b00;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    transition: background .25s ease;
}

.btn-primary:hover {
    background: #ff7f26;
}

.btn-ghost {
    display: inline-block;
    padding: 12px 22px;
    border: 2px solid #ff6b00;
    color: #ff6b00;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    transition: background .25s ease, color .25s ease;
}

.btn-ghost:hover {
    background: #ff6b00;
    color: white;
}

/* RESPONSIVE */
@media (max-width: 900px) {
    .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 600px) {
    .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

body {
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.section-title {
    font-size: 32px;

    text-align: center;
}

.section-subtitle {
    display: block;
    text-align: center;
    opacity: .7;
    margin-top: 6px;
}

</style>
</head>

     ============================ -->
<div id="zoomOverlay" onclick="closeZoom()">

<script>
function openZoom(src) {

    document.getElementById("zoomOverlay").style.display = "flex";
}

function closeZoom() {
    document.getElementById("zoomOverlay").style.display = "none";
}
